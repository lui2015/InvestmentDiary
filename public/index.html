<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="description" content="投资日记 — 记录股票/基金/期货交易，统计盈亏，止盈止损，结构化复盘。" />
  <title>投资日记</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect rx='8' width='32' height='32' fill='%2322d3ee'/%3E%3Cpath d='M7 21l6-7 5 4 7-10' stroke='%2304111a' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/themes.css" />
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="brand-logo">📈</span>
        <div>
          <div class="brand-name">投资日记</div>
          <div class="brand-sub">记录 · 统计 · 复盘</div>
        </div>
      </div>
      <nav class="nav-list" id="sideNav"></nav>
      <div class="side-foot">
        <div class="user-chip" id="userChip" hidden>
          <span class="user-avatar" id="userAvatar">U</span>
          <span class="user-name" id="userName"></span>
        </div>
        <button class="btn ghost block" id="themeBtn">主题外观</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1 class="page-title" id="pageTitle">总览</h1>
          <p class="page-sub" id="pageSub">今天的仓位与盈亏</p>
        </div>
        <div class="topbar-actions">
          <button class="btn primary small quick-desk" id="quickAdd" hidden>+ 记一笔</button>
          <button class="icon-btn" id="themeBtn2" title="切换主题" aria-label="切换主题">🎨</button>
          <button class="logout" id="logoutBtn" hidden>退出</button>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>
    <button class="fab" id="fabAdd" hidden title="记一笔" aria-label="记一笔">+</button>
  </div>

  <div class="modal-mask" id="themeModal" hidden>
    <div class="modal">
      <div class="modal-head"><h3>选择主题</h3><button class="modal-close" id="themeClose" aria-label="关闭">✕</button></div>
      <div class="theme-grid" id="themeGrid"></div>
    </div>
  </div>

  <div class="modal-mask" id="formModal" hidden>
    <div class="modal modal-lg" id="formModalBox">
      <div class="modal-head"><h3 id="formTitle">标题</h3><button class="modal-close" id="formClose" aria-label="关闭">✕</button></div>
      <div class="modal-body" id="formBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="./js/api.js"></script>
  <script src="./js/theme.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
